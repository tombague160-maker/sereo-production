# CI Sereo : valide les PRs (npm run check + npm test + les e2e) avant merge.
#
# Sans ce workflow, un commit cassé pouvait passer en main, etre tagge par
# release-please et auto-deploye par sereo-updater 15 min plus tard.
# Le blocage du merge n'est PAS dans ce fichier : c'est la protection de main
# (reglages du depot, compte proprietaire), qui exige les verdicts
# « Tests + syntax check » et « Tests e2e (Playwright) ». Renommer l'un de ces
# jobs sans changer la protection bloque toutes les PR.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lancement a la demande, utilise par release-please.yml sur sa PR de
  # version : une PR ouverte ou mise a jour avec le jeton par defaut ne
  # declenche pas `pull_request` (regle de GitHub contre les boucles) -- 0
  # execution sur les PR de version #179 a #187. Sans ce lancement, la
  # protection de main les bloquerait pour toujours.
  workflow_dispatch:

# Une PR poussee de nouveau rend son execution en cours inutile : elle est
# annulee (25/09 ; mesure de la chasse aux defauts : 31 executions devenues
# inutiles en 7 jours, ~496 min). PAS sur main : chaque commit de main garde
# son verdict jusqu'au bout -- c'est celui qu'une etiquette de version, puis
# le deploiement, peuvent viser. D'ou un groupe PAR EXECUTION hors PR : un
# groupe partage mettrait les executions de main en file, et GitHub annule
# celle qui attend quand une autre arrive.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: npm run check

      - name: Run tests (node --test)
        run: npm test

  # Les e2e tournent dans des jobs SEPARES, et c'est delibere : ils demarrent un
  # vrai serveur et pilotent un navigateur, donc ils echouent pour des raisons
  # que les tests unitaires ne connaissent pas. Melanges, un e2e instable
  # rendrait illisible le signal des 348 unitaires. Separes, on voit lequel
  # des deux parle.
  #
  # Sans ces jobs, les tests de non-regression visuels n'auraient jamais tourne
  # ailleurs que sur le poste de celui qui les a ecrits -- c'est-a-dire nulle
  # part. Deux d'entre eux gardent des defauts mesures et corriges le 17/09 :
  # l'onglet actif illisible en mode sombre (4,42:1) et l'accordeon de la barre
  # laterale qui ne repliait rien en sombre.
  #
  # QUATRE LOTS (25/09). La suite (723 tests, un seul ouvrier) prenait 37 min
  # sur une machine : le temps de retour d'une PR. Playwright la coupe en
  # quatre (--shard) : chaque test tourne dans exactement un lot (liste
  # verifiee : l'union des quatre `--list --shard=i/4` est la liste entiere),
  # chaque lot sur sa machine, avec UN ouvrier comme avant -- meme charge par
  # machine, donc meme garantie contre l'instabilite nee de la charge.
  e2e-lots:
    name: Tests e2e (lot ${{ matrix.lot }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Un lot rouge n'arrete pas les autres : tout le rouge se voit en une fois.
      fail-fast: false
      matrix:
        lot: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Seul Chromium : c'est le seul projet declare dans playwright.config.js.
      # --with-deps installe les bibliotheques systeme que le navigateur exige
      # sur un runner nu.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Les serveurs de test sont demarres par playwright.config.js (webServer),
      # ports 3100 et 3101, auth desactivee sur le premier, bases SQLite dediees.
      - name: Run e2e (playwright, lot ${{ matrix.lot }}/4)
        run: npm run test:e2e -- --shard=${{ matrix.lot }}/4

      # En cas d'echec, la trace du premier reessai et les captures permettent
      # de comprendre sans rejouer localement.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-lot-${{ matrix.lot }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Le verdict des e2e, sous le NOM d'avant : une protection de branche qui
  # exige « Tests e2e (Playwright) » exige les quatre lots verts.
  #
  # Il tourne TOUJOURS, y compris quand l'execution est annulee (26/09, apres
  # relecture adverse). Un job que sa condition fait sauter rapporte
  # « Success » et ne bloque pas une PR, meme exige (doc GitHub, « Using
  # conditions to control job execution »). Avec `!cancelled()`, annuler
  # l'execution a la main pendant les lots faisait sauter ce verdict : la PR
  # devenait fusionnable sans qu'aucun e2e ait juge son dernier commit. Avant
  # les lots, le job unique annule rapportait « cancelled », qui bloque. Ici,
  # annule, il tourne et dit rouge (lots « cancelled ») : il faut relancer.
  # Une execution perimee (nouvelle poussee sur la PR) rend ce rouge sur un
  # commit qui n'est plus la tete de la PR : sans effet. La mise en garde de
  # GitHub contre `always()` vise les etapes qui peuvent rester bloquees
  # (checkout...) ; ce job n'a qu'un `test`, sans rien telecharger.
  e2e:
    name: Tests e2e (Playwright)
    needs: e2e-lots
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Les quatre lots sont verts
        run: |
          echo "Lots e2e : ${{ needs.e2e-lots.result }}"
          test "${{ needs.e2e-lots.result }}" = "success"
