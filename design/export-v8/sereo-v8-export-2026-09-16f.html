document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px\">\n\n    <div id=\"1a\" style=\"display: flex; flex-direction: column; gap: 20px; width: 900px\">\n      <div style=\"display: flex; align-items: center; gap: 12px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; background: #386B6D; border-radius: 999px; padding: 6px 12px\">1a<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #386B6D\">Design system<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #FBF7F5; border-radius: 36px; padding: 40px; display: flex; flex-direction: column; gap: 44px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n\n        <div style=\"display: flex; flex-direction: column; gap: 18px\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #4F7477\">Marque<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px\">\n            <div style=\"background: #FFFFFF; border-radius: 24px; padding: 28px 32px; display: flex; align-items: flex-end; gap: 4px\">\n              <div style=\"font-size: 44px; font-weight: 700; letter-spacing: -0.03em; color: #EF9177; line-height: 1\">séréo<\u002Fdiv>\n              <svg width=\"30\" height=\"16\" sc-camel-view-box=\"0 0 30 16\" fill=\"none\" style=\"margin-bottom: 6px\"><path d=\"M4 4c6 8 16 8 22 0\" stroke=\"#EF9177\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"background: #0D1518; border-radius: 24px; padding: 28px 32px; display: flex; align-items: flex-end; gap: 4px\">\n              <div style=\"font-size: 44px; font-weight: 700; letter-spacing: -0.03em; color: #F5A08F; line-height: 1\">séréo<\u002Fdiv>\n              <svg width=\"30\" height=\"16\" sc-camel-view-box=\"0 0 30 16\" fill=\"none\" style=\"margin-bottom: 6px\"><path d=\"M4 4c6 8 16 8 22 0\" stroke=\"#F5A08F\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13.5px; font-weight: 400; line-height: 1.55; color: #4F7477\">« séréo » en minuscules Poppins 700 orange, sourire orange sous le « o ». Le mot est du texte, pas une image : il suit la taille de texte du système et ne pixelise pas. Le sourire est un tracé — pas de texte dans les images.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #4F7477\">Couleurs — mode clair<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n\n            <div style=\"display: grid; grid-template-columns: 56px 168px 1fr 150px; align-items: center; gap: 16px; background: #FFFFFF; border-radius: 18px; padding: 12px 16px\">\n              <div style=\"height: 40px; border-radius: 12px; background: #386B6D\"><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Principal<\u002Fdiv><div style=\"font-size: 13px; font-weight: 500; color: #4F7477; font-variant-numeric: tabular-nums\">#386B6D<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size: 13.5px; font-weight: 400; line-height: 1.5; color: #4F7477\">Actions, titres, texte courant, navigation active, corps des marqueurs. 6,01:1 avec le blanc, dans les deux sens<\u002Fdiv>\n              <div style=\"font-size: 13px; font-weight: 500; color: #386B6D; font-variant-numeric: tabular-nums\">blanc dessus 6,01:1<br>sur fond 5,64:1<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: 56px 168px 1fr 150px; align-items: center; gap: 16px; background: #FFFFFF; border-radius: 18px; padding: 12px 16px\">\n              <div style=\"height: 40px; border-radius: 12px; background: #2A5254\"><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Principal appuyé<\u002Fdiv><div style=\"font-size: 13px; font-weight: 500; color: #4F7477; font-variant-numeric: tabular-nums\">#2A5254<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size: 13.5px; font-weight: 400; line-height: 1.5; color: #4F7477\">Survol, enfoncé, et <b style=\"font-weight: 600; color: #386B6D\">texte des badges<\u002Fb> sur pêche et vert d'eau<\u002Fdiv>\n              <div style=\"font-size: 13px; font-weight: 500; color: #386B6D; font-variant-numeric: tabular-nums\">sur pêche 5,61:1<br>sur vert d'eau 4,59:1<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: 56px 168px 1fr 150px; align-items: center; gap: 16px; background: #FFFFFF; border-radius: 18px; padding: 12px 16px\">\n              <div style=\"height: 40px; border-radius: 12px; background: #EF9177\"><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Accent<\u002Fdiv><div style=\"font-size: 13px; font-weight: 500; color: #4F7477; font-variant-numeric: tabular-nums\">#EF9177<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size: 13.5px; font-weight: 400; line-height: 1.5; color: #4F7477\">Barres de progression, halo de l'arrêt en cours, points d'état, marque. Jamais un fond de texte<\u002Fdiv>\n              <div style=\"font-size: 13px; font-weight: 500; color: #C02B0A; font-variant-numeric: tabular-nums\">blanc dessus 2,34:1<br>vert dessus 2,57:1<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: 56px 168px 1fr 150px; align-items: center; gap: 16px; background: #FFFFFF; border-radius: #DDEBE9; box-shadow: inset 0 0 0 1px rgba(56,107,109,.08)\"><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Vert clair<\u002Fdiv><div style=\"font-size: 13px; font-weight: 500; color: #4F7477; font-variant-numeric: tabular-nums\">#DDEBE9<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size: 13.5px; font-weight: 400; line-height: 1.5; color: #4F7477\">Fond de badge froid. Texte en #2A5254<\u002Fdiv>\n              <div style=\"font-size: 13px; font-weight: 500; color: #386B6D; font-variant-numeric: tabular-nums\">7,04:1<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: 56px 168px 1fr 150px; align-items: center; gap: 16px; background: #FFFFFF; border-radius: 18px; padding: 12px 16px\">\n              <div style=\"height: 40px; border-radius: 12px; background: #F7E4E0; box-shadow: inset 0 0 0 1px rgba(56,107,109,.08)\"><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Pêche claire<\u002Fdiv><div style=\"font-size: 13px; font-weight: 500; color: #4F7477; font-variant-numeric: tabular-nums\">#F7E4E0<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size: 13.5px; font-weight: 400; line-height: 1.5; color: #4F7477\">Fond de badge tiède. Texte en #2A5254<\u002Fdiv>\n              <div style=\"font-size: 13px; font-weight: 500; color: #386B6D; font-variant-numeric: tabular-nums\">7,04:1<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: 56px 168px 1fr 150px; align-items: center; gap: 16px; background: #FFFFFF; border-radius: 18px; padding: 12px 16px\">\n              <div style=\"height: 40px; border-radius: 12px; background: #FBF7F5; box-shadow: inset 0 0 0 1px rgba(56,107,109,.1)\"><\u002Fdiv>\n              <div style=\"display: flex; flex-directi 77\"><\u002Fcircle><\u002Fsvg>\n            <div style=\"height: 33px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; line-height: 1.25; text-align: center; color: #4F7477\">Plus<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ annotations }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n          <div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Annotations<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; font-weight: 400; line-height: 1.55; color: #4F7477\">\n            <div><b style=\"font-weight: 600; color: #386B6D\">Sélecteur de mois.<\u002Fb> Tap → sheet des 12 derniers mois. Le mois en cours est l'accent sur le graphe ; les autres barres sont vert d'eau. Tap sur une barre → ce mois devient le mois affiché.<\u002Fdiv>\n            <div><b style=\"font-weight: 600; color: #386B6D\">Chiffre d'affaires.<\u002Fb> Somme des bons au statut « Livrée » sur le mois métier (<span style=\"font-family: ui-monospace, monospace; font-size: 12.5px; color: #386B6D\">dateCommande<\u002Fspan>), pas la date d'import. Panier moyen = CA ÷ bons livrés. Tap → Commandes filtrées « Livrée · septembre ».<\u002Fdiv>\n            <div><b style=\"font-weight: 600; color: #386B6D\">En préparation / En livraison.<\u002Fb> Chaque tuile ouvre sa liste, déjà filtrée. « En livraison » ouvre le cockpit si une tournée est en cours, la liste sinon.<\u002Fdiv>\n            <div><b style=\"font-weight: 600; color: #386B6D\">À régler.<\u002Fb> Tri par urgence, pas par type : abonnement en retard → commande bloquée → stock sous le seuil → adresse à corriger. Zéro alerte = la carte disparaît, elle n'affiche pas « rien à signaler ».<\u002Fdiv>\n            <div><b style=\"font-weight: 600; color: #386B6D\">Cette semaine.<\u002Fb> Échéances d'abonnement de la semaine en cours, par jour croissant ; les jours sans livraison sont omis. Tap sur une ligne → sheet avec « Créer la commande » et « Reporter ».<\u002Fdiv>\n            <div><b style=\"font-weight: 600; color: #386B6D\">États.<\u002Fb> Chargement : les cartes gardent leur forme, les chiffres sont des blocs vert d'eau qui pulsent (coupé sous <span style=\"font-family: ui-monospace, monospace; font-size: 12.5px; color: #386B6D\">prefers-reduced-motion<\u002Fspan>). Hors ligne : bandeau vert d'eau sous l'en-tête, « Données de 9 h 12 — hors ligne », le reste reste lisible. Premier lancement : une seule carte, « Importe ton fichier de ventes pour commencer » + bouton.<\u002Fdiv>\n            <div><b style=\"font-weight: 600; color: #386B6D\">Barre basse.<\u002Fb> Tableau de bord · Préparer · Tournée · Abonnements, puis « Plus » (Commandes, Stock, Clients, Analyse, Paramètres). Chaque item est dimensionné par son libellé, pas en cinquièmes égaux : « Abonnements » fait 94 px à 13 px et ne tiendrait pas dans 78. « Préparer » plutôt que « Préparation » pour la même raison. Tap sur l'onglet actif → retour en haut de l'écran.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"display: flex; flex-direction: column; gap: 28px; padding: 0 48px 48px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px\">\n\n    <div id=\"2a\" style=\"display: flex; flex-direction: column; gap: 20px; width: 470px\">\n      <div style=\"display: flex; align-items: center; gap: 12px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; background: #386B6D; border-radius: 999px; padding: 6px 12px\">2a<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #386B6D \n\n        <div style=\"position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: rgba(251,247,245,.74); backdrop-filter: blur(20px) saturate(180%); display: flex; align-items: flex-start; justify-content: space-between; padding: 10px 10px 0\">\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 4px; min-height: 48px; cursor: pointer\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z\" stroke=\"#4F7477\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"height: 33px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; line-height: 1.25; text-align: center; color: #4F7477\">Tableau<br>de bord<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 4px; min-height: 48px; cursor: pointer\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"4\" stroke=\"#4F7477\" stroke-width=\"2\"><\u002Frect><path d=\"M8 10h8M8 14h5\" stroke=\"#4F7477\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"height: 33px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; line-height: 1.25; text-align: center; color: #4F7477\">Préparer<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 4px; min-height: 48px; cursor: pointer\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M3 7h10v9H3z\" stroke=\"#4F7477\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M13 10h4l3 3v3h-7z\" stroke=\"#4F7477\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"7\" cy=\"18\" r=\"2\" stroke=\"#4F7477\" stroke-width=\"2\"><\u002Fcircle><circle cx=\"17\" cy=\"18\" r=\"2\" stroke=\"#4F7477\" stroke-width=\"2\"><\u002Fcircle><\u002Fsvg>\n            <div style=\"height: 33px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; line-height: 1.25; text-align: center; color: #4F7477\">Tournée<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 4px; min-height: 48px; cursor: pointer\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M4 9a5 5 0 0 1 5-5h6l-2-2m6 8a5 5 0 0 1-5 5H8l2 2\" stroke=\"#386B6D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"height: 33px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; line-height: 1.25; text-align: center; color: #386B6D\">Abonnements<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 4px; min-height: 48px; cursor: pointer\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"5\" cy=\"12\" r=\"1.8\" fill=\"#4F7477\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"1.8\" fill=\"#4F7477\"><\u002Fcircle><circle cx=\"19\" cy=\"12\" r=\"1.8\" fill=\"#4F7477\"><\u002Fcircle><\u002Fsvg>\n            <div style=\"height: 33px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; line-height: 1.25; text-align: center; color: #4F7477\">Plus<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width: 430px; display: flex; flex-direction: column; gap: 16px; padding-top: 56px\">\n      <div style=\"background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n        <div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Abonnements — annotations<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; font-weight: 400; line-height: 1.55; color: #4F7477\">\n          <div><b style=\"font-weight: 600; color: #386B6D\">Tri de la liste.<\u002Fb> En retard d'abord, puis par prochaine livraison croissante, les en pause en dernier. Le tri ne change pas avec les filtres — seul le contenu change.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Ligne d'abonnement.<\u002Fb> Trois lignes de deux informations : client + état, échéance + fréquence, produits + rappel. Elle fait 96 px, pas 72 : six champs demandés ne tiennent pas dans une ligne simple, et j'ai préféré dépasser la hauteur plutôt que cacher le rappel derrière un tap.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Tap sur une ligne<\u002Fb> → la fiche : mêmes champs qu'à la création, plus « Mettre en pause » et l'historique des livraisons. « En retard » ouvre directement sur « Créer la commande ».<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Aperçu des dates.<\u002Fb> Il se recalcule à chaque tap sur une pilule de fréquence, sans validation. La première date porte la mention « départ », les suivantes « + 15 j » : c'est ce qui rend l'intervalle strict lisible.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Les 90 jours.<\u002Fb> Par semaine, semaines vides omises. Le bouton rond « + » de chaque échéance crée le bon de commande en un geste ; un toast « Bon CMD-2026-0xx créé » avec Annuler, pas de confirmation.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Pause et reprise.<\u002Fb> Une pause n'efface rien : l'abonnement garde sa fréquence et affiche « En pause depuis le 4 septembre ». À la reprise, la prochaine date est recalculée depuis le jour de reprise, pas depuis l'échéance manquée.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Ce dont je ne suis pas sûr.<\u002Fb> « Mensuel » : j'ai supposé même date chaque mois (le 22), avec repli sur le dernier jour pour les 29, 30 et 31. Et le stock affiché sous chaque produit à la création — utile, ou bruit inutile à ce moment-là ?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 28px; padding: 0 48px 48px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px\">\n\n    <div id=\"4a\" style=\"display: flex; flex-direction: column; gap: 20px; width: 390px\">\n      <div style=\"display: flex; align-items: center; gap: 12px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; background: #386B6D; border-radius: 999px; padding: 6px 12px\">4a<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #386B6D\">Tournée — préparer<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #FBF7F5; position: relative; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 24px 60px rgba(15,61,61,.14); font-family: Poppins, sans-serif\">\n        <div class=\"sc\" style=\"position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden\">\n          <div style=\"background: #386B6D; border-radius: 0 0 28px 28px; padding: 54px 20px 20px; display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"font-size: 13.5px; font-weight: 500; color: #D6E5E3\">Mercredi 16 septembre<\u002Fdiv>\n            <div style=\"font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: #F x\"><path d=\"M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z\" stroke=\"#4F7477\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.4\" stroke=\"#4F7477\" stroke-width=\"2\"><\u002Fcircle><\u002Fsvg>\n                <div style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\">\n                  <div style=\"font-size: 13px; font-weight: 500; color: #4F7477\">Arrivée<\u002Fdiv>\n                  <div style=\"font-size: 15.5px; font-weight: 600; color: #386B6D\">Entrepôt, 4 rue de Dole, Besançon<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button style=\"width: 100%; height: 48px; border: 1.5px solid #386B6D; border-radius: 999px; background: transparent; color: #386B6D; font-family: Poppins, sans-serif; font-size: 15.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform 100ms ease-out\" style-active=\"transform: scale(.97)\">\n                <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M20 4 4 11l7 2 2 7z\" stroke=\"#386B6D\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                Y aller\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: rgba(251,247,245,.82); backdrop-filter: blur(20px) saturate(180%); display: flex; gap: 10px\">\n          <button style=\"flex: none; height: 48px; padding: 0 20px; border: 1.5px solid #386B6D; border-radius: 999px; background: transparent; color: #386B6D; font-family: Poppins, sans-serif; font-size: 15.5px; font-weight: 600; cursor: pointer; transition: transform 100ms ease-out\" style-active=\"transform: scale(.97)\">Reprogrammer<\u002Fbutton>\n          <button style=\"flex: 1; height: 48px; border: none; border-radius: 999px; background: #386B6D; color: #FFFFFF; font-family: Poppins, sans-serif; font-size: 15.5px; font-weight: 600; cursor: pointer; transition: transform 100ms ease-out\" style-active=\"transform: scale(.97)\">Clôturer<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width: 430px; display: flex; flex-direction: column; gap: 16px; padding-top: 56px\">\n      <div style=\"background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n        <div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Tournée — annotations<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; font-weight: 400; line-height: 1.55; color: #4F7477\">\n          <div><b style=\"font-weight: 600; color: #386B6D\">Préparer.<\u002Fb> Départ et arrivée en vert clair : ce sont des valeurs déjà posées, pas des champs vides. « Me localiser » remplace le départ par la position ; en cas de refus de géolocalisation, le champ reste et un mot sous le bouton dit pourquoi. Le tri de la liste est par secteur puis par numéro de bon. Kilomètres et durée se recalculent à chaque coche.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Cockpit.<\u002Fb> Trois gestes sous le pouce : « Livré » en 56 px au centre, « Client absent » et « Problème » en dessous en 48 px — moins hauts et sans couleur, parce qu'ils sont plus rares et plus lourds de conséquences. « Y aller » ouvre Google Maps ; la carte Séréo reste Leaflet. Appeler à gauche, articles à droite.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Après « Livré ».<\u002Fb> Passage automatique à l'arrêt suivant, toast « Livré — EHPAD Les Tilleuls » avec Annuler pendant 4 s. Pas de confirmation : l'action est réversible tant que le toast est là.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Carte.<\u002Fb> Plein écran, cockpit en surimpression. Réordonner à la main invalide le tracé : le trait passe en pointillé et « Recalculer le tracé » apparaît, cerclé d'orange, au-dessus de la sheet. L'arrêt en cours garde son halo.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Fin de tournée.<\u002Fb> Pas de fond de fête ni de confettis : les trois chiffres, les problèmes nommés, le lien vers l'arrivée. « Clôturer » est irréversible — c'est le seul écran de cette série qui demande une confirmation.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Barre basse absente sur la carte.<\u002Fb> C'est volontaire : la carte est un mode plein écran dont on sort par la flèche en haut à gauche, comme on y est entré. Sur le cockpit, la barre basse cède la place aux trois gestes — le retour se fait par la carte ou par la flèche.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Ce dont je ne suis pas sûr.<\u002Fb> Le fond de carte ici est une esquisse, pas Leaflet : les tuiles OpenStreetMap réelles sont plus chargées et le tracé orange devra peut-être un liseré blanc pour rester lisible. Et « Problème » ouvre-t-il une sheet à motifs prédéfinis (portail fermé, refus, erreur d'adresse) ou un champ libre ?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 28px; padding: 0 48px 48px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px\">\n\n    <div id=\"5a\" style=\"display: flex; flex-direction: column; gap: 20px; width: 390px\">\n      <div style=\"display: flex; align-items: center; gap: 12px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; background: #386B6D; border-radius: 999px; padding: 6px 12px\">5a<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.02em; colo     <div><b style=\"font-weight: 600; color: #386B6D\">Une ligne par commande, cinq dans l'écran.<\u002Fb> J'ai remplacé les cartes de la planche par la ligne de liste de 72 px : les cartes en donnaient trois et c'est là que naissaient les dix-neuf écrans de défilement. Le compteur de tête et la liste tiennent ensemble sous la ligne de flottaison.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Tri.<\u002Fb> Bloquées d'abord, puis en préparation, à vérifier, prêt livraison. À statut égal, par secteur puis par numéro de bon. Une commande qui se débloque remonte immédiatement — le tri est vivant, pas figé à l'ouverture.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Tap sur une ligne<\u002Fb> → la commande (<a href=\"#7b\">7b<\u002Fa>). Les lignes se cochent une par une ; le compteur et la barre suivent. Une ligne cochée reste cochée si l'application se ferme.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">« Préparation terminée » désactivé<\u002Fb> tant qu'il manque un article, avec la raison écrite sous le bouton — jamais un bouton gris sans explication. Dès que les six lignes sont cochées, il s'active et le statut passe à « Préparation terminée ».<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Manquants.<\u002Fb> La ligne porte la quantité demandée en alerte et « 2 en stock, 2 manquants » en clair. Un tap dessus propose « Commander » (vers Stock) ou « Livrer partiellement ».<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Ce dont je ne suis pas sûr.<\u002Fb> Cocher ligne par ligne, ou une seule case « tout préparé » avec les exceptions à décocher ? Sur 43 articles en six lignes la case unique serait plus rapide, mais elle perd la trace de ce qui a été vraiment vu.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 28px; padding: l-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M4 9a5 5 0 0 1 5-5h6l-2-2m6 8a5 5 0 0 1-5 5H8l2 2\" stroke=\"#4F7477\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"height: 33px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; line-height: 1.25; text-align: center; color: #4F7477\">Abonnements<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 4px; min-height: 48px; cursor: pointer\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"5\" cy=\"12\" r=\"1.8\" fill=\"#386B6D\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"1.8\" fill=\"#386B6D\"><\u002Fcircle><circle cx=\"19\" cy=\"12\" r=\"1.8\" fill=\"#386B6D\"><\u002Fcircle><\u002Fsvg>\n            <div style=\"height: 33px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; line-height: 1.25; text-align: center; color: #386B6D\">Plus<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width: 430px; display: flex; flex-direction: column; gap: 16px; padding-top: 56px\">\n      <div style=\"background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n        <div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Commandes, Stock, Clients, Paramètres — annotations<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; font-weight: 400; line-height: 1.55; color: #4F7477\">\n          <div><b style=\"font-weight: 600; color: #386B6D\">Commandes.<\u002Fb> Les cinq listes d'aujourd'hui deviennent six pilules : Toutes · À préparer · Prêt livraison · En livraison · Livrées · Planifiées. « À recommander » part dans Stock, où elle appartient. Une seule liste, un seul tri.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Tri.<\u002Fb> Date décroissante par défaut — c'est ce qu'on cherche le plus. Le sélecteur propose aussi numéro, client, secteur, statut. La date est en colonne à gauche, ce qui la rend balayable sans la compter comme une information de la ligne : client, numéro + secteur, statut.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Planifiées.<\u002Fb> Les échéances d'abonnement apparaissent ici en « Planifiée » avant d'exister comme bon. La ligne dit « Abonnement » au lieu d'un numéro, puisqu'il n'y en a pas encore.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Stock.<\u002Fb> « À recommander » est en tête, pas en onglet : c'est la seule chose de cet écran qui demande une action. Les catégories ne sont pas figées — elles sont lues dans la colonne du fichier importé, donc leur nombre et leurs noms sont inconnus au dessin. La grille à deux colonnes tient de une à huit ; au-delà, une colonne de lignes de 72 px. Sans colonne de catégorie, l'écran montre les produits à plat, sans tuiles. Tap sur une tuile → les produits de la catégorie, avec les boutons + et −.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Clients.<\u002Fb> La fiche, pas la liste : appeler et l'itinéraire sont les deux gestes du terrain, donc en haut sous le nom. L'abonnement en retard remonte au-dessus de l'historique avec « Créer la commande » — le même geste que depuis Abonnements.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Paramètres.<\u002Fb> Thème en trois choix, « Système » par défaut, et la phrase qui dit que le réglage est propre à l'appareil. Les trois secteurs d'origine ne se suppriment pas. La zone dangereuse (purge des commandes) n'est pas sur cet écran : elle est derrière « Archives », avec confirmation écrite.<\u002Fdiv>\n ont-weight: 500; color: #386B6D\">sereo<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"font-size: 13px; font-weight: 500; color: #4F7477\">Mot de passe<\u002Fdiv>\n              <div style=\"height: 48px; border-radius: 18px; background: #F5F1EE; padding: 0 8px 0 18px; display: flex; align-items: center; justify-content: space-between\">\n                <div style=\"font-size: 15.5px; font-weight: 400; color: #4F7477\">••••••••••<\u002Fdiv>\n                <div style=\"width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z\" stroke=\"#4F7477\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\" stroke=\"#4F7477\" stroke-width=\"2\"><\u002Fcircle><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button style=\"width: 100%; height: 48px; border: none; border-radius: 999px; background: #386B6D; color: #FFFFFF; font-family: Poppins, sans-serif; font-size: 15.5px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: transform 100ms ease-out\" style-active=\"transform: scale(.97)\">Se connecter<\u002Fbutton>\n            <div style=\"display: flex; align-items: center; gap: 10px; padding: 4px 4px 0\">\n              <div style=\"width: 22px; height: 22px; border-radius: 7px; background: #386B6D; display: flex; align-items: center; justify-content: center; flex: none\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M20 6 9 17l-5-5\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"font-size: 14px; font-weight: 500; color: #386B6D\">Rester connecté sur cet appareil<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 0 28px 40px; display: flex; flex-direction: column; gap: 6px; position: relative; background: #FBF7F5\">\n          <div style=\"font-size: 13px; font-weight: 400; line-height: 1.5; color: #4F7477\">Un seul compte, partagé par l'équipe. Mot de passe oublié : voir Tom.<\u002Fdiv>\n          <div style=\"font-size: 12.5px; font-weight: 500; color: #4F7477\">Version 1.22.0<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width: 430px; display: flex; flex-direction: column; gap: 16px; padding-top: 56px\">\n      <div style=\"background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n        <div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Clients et connexion — annotations<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; font-weight: 400; line-height: 1.55; color: #4F7477\">\n          <div><b style=\"font-weight: 600; color: #386B6D\">Liste des clients.<\u002Fb> Tri par nom A → Z par défaut, aussi par secteur, par nombre de commandes, par dernière commande. Ligne de 72 px : nom, secteur + nombre de commandes, et le badge d'abonnement s'il y en a un. Pas de badge = pas abonné ; l'absence est l'information.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">« Abonnés ».<\u002Fb> C'est un filtre, pas un secteur — il a une icône pour le distinguer des trois pilules de secteur et se combine avec elles. Même logique que « Bloquée » : un axe orthogonal ne se mélange pas aux pilules qui s'excluent.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Adresse à corriger.<\u002Fb> L'alerte remplace la seconde ligne, avec icône et mot. Elle vient du géocodage raté à l'import ; tap → la fiche, ouverte sur le champ adresse.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Connexion.<\u002Fb> Un seul compte aujourd'hui, donc pas de « créer un compte » ni de « mot de passe oublié » automatisé — la phrase du bas dit la vérité : voir Tom. La case « Rester connecté » reprend la session de 12 h du serveur. Erreur : le champ mot de passe passe en contour alerte avec « Identifiant ou mot de passe incorrect » dessous, jamais lequel des deux.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Ce dont je ne suis pas sûr.<\u002Fb> Le nombre de commandes dans la ligne client — est-ce l'information que Tom veut voir, ou plutôt la date de la dernière livraison ? Et la connexion : quand les comptes par personne s'ouvriront, faut-il déjà prévoir la place d'un sélecteur d'utilisateur ?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 28px; padding: 0 48px 48px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px\">\n\n    <div id=\"10a\" style=\"display: flex; flex-direction: column; gap: 20px; width: 390px\">\n      <div style=\"display: flex; align-items: center; gap: 12px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; background: #386B6D; border-radius: 999px; padding: 6px 12px\">10a<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #386B6D\">État vide — Stock sans catégorie<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #FBF7F5; position: relative; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 24px 60px rgba(15,61,61,.14); font-family: Poppins, sans-serif\">\n        <div style=\"position: absolute; top: 300px; right: -110px; width: 260px; height: 260px; border-radius: 999px; background: #A1C4C0; opacity: .22; filter: blur(10px)\"><\u002Fdiv>\n        <div class=\"sc\" style=\"position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden\">\n          <div style=\"background: #386B6D; border-radius: 0 0 28px 28px; padding: 54px 20px 18px; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <div style=\"font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: #FFFFFF\">Stock<\u002Fdiv>\n              <div style=\"font-size: 13.5px; font-weight: 500; color: #D6E5E3\">20 références · sans catégorie<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height: 48px; border-radius: 999px; background: #2A5254; padding: 0 18px; display: flex; align-items: center; gap: 10px; cursor: pointer\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"11\" cy=\"11\" r=\"7\" stroke=\"#D6E5E3\" stroke-width=\"2\"><\u002Fcircle><path d=\"m20 20-4.35-4.35\" stroke=\"#D6E5E3\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <div style=\"font-size: 15.5px; font-weight: 400; color: #D6E5E3\">Produit ou code<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding: 14px 16px 104px; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; gap: 14px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n              <div style=\"width: 40px; height: 40px; border-radius: 999px; background: #DDEBE9; display: flex; align-items: center; justify-content: center; flex: none\">\n                <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"# w: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n        <div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">États — annotations<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; font-weight: 400; line-height: 1.55; color: #4F7477\">\n          <div><b style=\"font-weight: 600; color: #386B6D\">Vide (<a href=\"#10a\">10a<\u002Fa>).<\u002Fb> Le cas demandé : Stock sans colonne de catégorie. L'écran ne dit pas « vide » — il a 20 produits — il dit ce qui manque et comment le retrouver, puis montre les produits à plat, sous le seuil en premier. Un état vide dit toujours quoi faire.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Chargement (<a href=\"#10b\">10b<\u002Fa>, haut).<\u002Fb> Les cartes gardent leur forme et leurs libellés ; seuls les chiffres sont des blocs #EDE6E2 aux dimensions du chiffre attendu. Ils pulsent à 1,6 s en opacité, coupé sous prefers-reduced-motion. Pas de roue qui tourne : la page ne bouge pas quand les données arrivent.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Premier lancement (<a href=\"#10b\">10b<\u002Fa>, bas).<\u002Fb> Une seule carte avec le geste qui débloque tout. Elle remplace « À régler » et « Cette semaine », qui n'ont pas de sens sans données.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Hors ligne (<a href=\"#10c\">10c<\u002Fa>).<\u002Fb> Bandeau vert clair sous l'en-tête, pas rouge : perdre le réseau en tournée est normal, pas une erreur. Il dit depuis quand, ce qui attend, et que ça se règle seul. « Livré », « Absent », « Problème » restent actifs et sont mis en file. « Y aller » est désactivé — Google Maps a besoin du réseau — et la distance affichée est datée. Appeler reste possible.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Erreur réseau hors tournée.<\u002Fb> Même bandeau, en haut de n'importe quel écran ; les actions d'écriture (importer, créer un abonnement) sont désactivées avec la raison dessous. Les toasts d'erreur sont réservés à un échec d'action précise : « L'import a échoué — fichier illisible » avec « Réessayer ».<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Ce dont je ne suis pas sûr.<\u002Fb> Combien de temps garder les livraisons en file avant d'alerter ? J'ai supposé qu'on ne dit rien tant que l'application est ouverte, et qu'on prévient au prochain lancement si la file n'est pas vide depuis plus de 12 h.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 28px; padding: 0 48px 48px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px\">\n\n    <div id=\"9c\" style=\"display: flex; flex-direction: column; gap: 20px; width: 390px\">\n      <div style=\"display: flex; align-items: center; gap: 12px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; background: #386B6D; border-radius: 999px; padding: 6px 12px\">9c<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #386B6D\">Connexion — 3e échec<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #FBF7F5; position: relative; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 24px 60px rgba(15,61,61,.14); font-family: Poppins, sans-serif; display: flex; flex-direction: column\">\n        <div style=\"position: absolute; top: -120px; right: -100px; width: 320px; height: 320px; border-radius: 999px; background: #EDC8C3; opacity: .5; filter: blur(10px)\"><\u002Fdiv>\n        <div style=\"position: absolute; bottom: 120px; left: -140px; width: 300px; height: 300px; border-radius: 999px; background: #A1C4C0; opacity: .3; filter: blur(10px)\"><\u002Fdiv>\n\n        <div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; position: relative\">\n          <div style=\"background: #FFFFFF; border-radius: 28px; padding: 32px 24px; display: flex; flex-direction: column; gap: 32px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n            <div style=\"display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; align-items: flex-end; gap: 4px\">\n                <div style=\"font-size: 52px; font-weight: 700; letter-spacing: -0.03em; color: #EF9177; line-height: 1\">séréo<\u002Fdiv>\n                <svg width=\"36\" height=\"20\" sc-camel-view-box=\"0 0 30 16\" fill=\"none\" style=\"margin-bottom: 7px\"><path d=\"M4 4c6 8 16 8 22 0\" stroke=\"#EF9177\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"font-size: 15.5px; font-weight: 400; line-height: 1.5; color: #4F7477\">Livraison de matériel médical et d'hygiène, Doubs et Jura.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <div style=\"font-size: 13px; font-weight: 500; color: #4F7477\">Identifiant<\u002Fdiv>\n                <div style=\"height: 48px; border-radius: 18px; background: #F5F1EE; padding: 0 18px; display: flex; align-items: center\">\n                  <div style=\"font-size: 15.5px; font-weight: 500; color: #386B6D\">sereo<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <div style=\"font-size: 13px; font-weight: 500; color: #4F7477\">Mot de passe<\u002Fdiv>\n                <div style=\"height: 48px; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #C02B0A; padding: 0 8px 0 18px; display: flex; align-items: center; justify-content: space-between\">\n                  <div style=\"font-size: 15.5px; font-weight: 400; color: #386B6D\">••••••••<\u002Fdiv>\n                  <div style=\"width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer\">\n                    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z\" stroke=\"#4F7477\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\" stroke=\"#4F7477\" stroke-width=\"2\"><\u002Fcircle><\u002Fsvg>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: flex; gap: 8px; align-items: flex-start; padding-top: 2px\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex: none; margin-top: 2px\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#C02B0A\" stroke-width=\"2\"><\u002Fcircle><path d=\"M12 8v4m0 3.5v.5\" stroke=\"#C02B0A\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                  <div style=\"font-size: 13.5px; font-weight: 500; line-height: 1.45; color: #C02B0A\">Identifiant ou mot de passe incorrect. Il te reste 2 tentatives avant un blocage de 15 secondes.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button style=\"width: 100%; height: 48px; border: none; border-radius: 999px; background: #386B6D; color: #FFFFFF; font-family: Poppins, sans-serif; font-size: 15.5px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: transform 100ms ease-out\" style-active=\"transform: scale(.97)\">Se connecter<\u002Fbutton>\n              <div style=\"display: flex; align-items: center; gap: 10px; padding: 4px 4px 0\">\n                <div style=\"width: 22px; height: 22px; border-radius: 7px; background: #386B6D; display: flex; align-items: center; justify-content: center; flex: none\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M20 6 9 17l-5-5\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <div style=\"font-size: 14px; font-weight: 500; color: #386B6D\">Rester connecté sur cet appareil<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 0 28px 40px; display: flex; flex-direction: column; gap: 6px; position: relative; background: #FBF7F5\">\n          <div style=\"font-size: 13px; font-weight: 400; line-height: 1.5; color: #4F7477\">Un seul compte, partagé par l'équipe. Mot de passe oublié : voir Tom.<\u002Fdiv>\n          <div style=\"font-size: 12.5px; font-weight: 500; color: #4F7477\">Version 1.22.0<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"9d\" style=\"display: flex; flex-direction: column; gap: 20px; width: 390px\">\n      <div style=\"display: flex; align-items: center; gap: 12px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; background: #386B6D; border-radius: 999px; padding: 6px 12px\">9d<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #386B6D\">Connexion — bloquée 15 s<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #FBF7F5; position: relative; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 24px 60px rgba(15,61,61,.14); font-family: Poppins, sans-serif; display: flex; flex-direction: column\">\n        <div style=\"position: absolute; top: -120px; right: -100px; width: 320px; height: 320px; border-radius: 999px; background: #EDC8C3; opacity: .5; filter: blur(10px)\"><\u002Fdiv>\n        <div style=\"position: absolute; bottom: 120px; left: -140px; width: 300px; height: 300px; border-radius: 999px; background: #A1C4C0; opacity: .3; filter: blur(10px)\"><\u002Fdiv>\n\n        <div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; position: relative\">\n          <div style=\"background: #FFFFFF; border-radius: 28px; padding: 32px 24px; display: flex; flex-direction: column; gap: 32px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n            <div style=\"display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; align-items: flex-end; gap: 4px\">\n                <div style=\"font-size: 52px; font-weight: 700; letter-spacing: -0.03em; color: #EF9177; line-height: 1\">séréo<\u002Fdiv>\n                <svg width=\"36\" height=\"20\" sc-camel-view-box=\"0 0 30 16\" fill=\"none\" style=\"margin-bottom: 7px\"><path d=\"M4 4c6 8 16 8 22 0\" stroke=\"#EF9177\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"font-size: 15.5px; font-weight: 400; line-height: 1.5; color: #4F7477\">Livraison de matériel médical et d'hygiène, Doubs et Jura.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background: #FBF7F5; border-radius: 18px; padding: 18px; display: flex; gap: 14px; align-items: center\">\n              <div style=\"width: 52px; height: 52px; flex: none; position: relative\">\n                <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 52 52\"><circle cx=\"26\" cy=\"26\" r=\"21\" fill=\"none\" stroke=\"#F5F1EE\" stroke-width=\"6\"><\u002Fcircle><circle cx=\"26\" cy=\"26\" r=\"21\" fill=\"none\" stroke=\"#386B6D\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-dasharray=\"79 132\" transform=\"rotate(-90 26 26)\"><\u002Fcircle><\u002Fsvg>\n                <div style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #386B6D; font-variant-numeric: tabular-nums\">9<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex: 1; display: flex; flex-direction: column; gap: 3px\">\n                <div style=\"font-size: 15.5px; font-weight: 600; color: #386B6D\">Connexion bloquée<\u002Fdiv>\n                <div style=\"font-size: 13.5px; font-weight: 400; line-height: 1.45; color: #4F7477\">Trop de tentatives depuis cette connexion. Réessaie dans 9 secondes.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <div style=\"font-size: 13px; font-weight: 500; color: #4F7477\">Identifiant<\u002Fdiv>\n                <div style=\"height: 48px; border-radius: 18px; background: #F5F1EE; padding: 0 18px; display: flex; align-items: center\">\n                  <div style=\"font-size: 15.5px; font-weight: 500; color: #4F7477\">sereo<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <div style=\"font-size: 13px; font-weight: 500; color: #4F7477\">Mot de passe<\u002Fdiv>\n                <div style=\"height: 48px; border-radius: 18px; background: #F5F1EE; padding: 0 18px; display: flex; align-items: center\">\n                  <div style=\"font-size: 15.5px; font-weight: 400; color: #4F7477\">••••••••<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button style=\"width: 100%; height: 48px; border: 1.5px solid #A1C4C0; border-radius: 999px; background: transparent; color: #4F7477; font-family: Poppins, sans-serif; font-size: 15.5px; font-weight: 500; margin-top: 6px\">Se connecter<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 0 28px 40px; display: flex; flex-direction: column; gap: 6px; position: relative; background: #FBF7F5\">\n          <div style=\"font-size: 13px; font-weight: 400; line-height: 1.5; color: #4F7477\">Un seul compte, partagé par l'équipe. Mot de passe oublié : voir Tom.<\u002Fdiv>\n          <div style=\"font-size: 12.5px; font-weight: 500; color: #4F7477\">Version 1.22.0<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width: 430px; display: flex; flex-direction: column; gap: 16px; padding-top: 56px\">\n      <div style=\"background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(15,61,61,.05), 0 12px 28px rgba(15,61,61,.05)\">\n        <div style=\"font-size: 14.5px; font-weight: 600; color: #386B6D\">Connexion — les deux états du serveur, et une règle nouvelle<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; font-weight: 400; line-height: 1.55; color: #4F7477\">\n          <div><b style=\"font-weight: 600; color: #386B6D\">Échec (<a href=\"#9c\">9c<\u002Fa>).<\u002Fb> Le champ mot de passe passe en contour alerte ; le message dit « identifiant ou mot de passe », jamais lequel, puis le nombre de tentatives restantes et la durée du blocage — l'avertissement avant le problème. Les champs restent actifs.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Bloquée (<a href=\"#9d\">9d<\u002Fa>).<\u002Fb> Cinq échecs en quinze minutes → quinze secondes. Le compteur du serveur est par adresse IP, pas par personne : la phrase n'attribue les échecs à personne — « Trop de tentatives depuis cette connexion ». Un anneau décompte, la phrase se met à jour chaque seconde, les deux champs et le bouton passent en désactivé — le bouton prend la forme du désactivé de la charte, contour vert d'eau. À zéro, tout se réactive sans rechargement et le message disparaît.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Formes de fond.<\u002Fb> Règle : une forme décorative passe sous du texte seulement si la couleur composée tient le seuil, mesurée au pire point de l'intersection, pas au centre de la ligne. Le secondaire sur vert n'a que 0,13 de marge, donc aucun halo blanc ne survit sous lui : retirés de <a href=\"#3a\">3a<\u002Fa> et <a href=\"#6a\">6a<\u002Fa>. Appliqué aussi à <a href=\"#9b\">9b<\u002Fa>, <a href=\"#9c\">9c<\u002Fa>, <a href=\"#9d\">9d<\u002Fa> et <a href=\"#4d\">4d<\u002Fa>. La connexion met son contenu dans une carte blanche opaque ; le rond du bas s'arrête au-dessus du pied de page, qui a lui-même un fond opaque. La fin de tournée perd son rond du haut, qui passait sous le titre. Le texte secondaire y retrouve ses 4,81:1 réels.<\u002Fdiv>\n          <div><b style=\"font-weight: 600; color: #386B6D\">Hors ligne (<a href=\"#10c\">10c<\u002Fa>) — inventé, à chiffrer.<\u002Fb> « 2 livraisons en attente d'envoi » décrit une file d'attente qui n'existe pas : aujourd'hui une écriture hors réseau échoue, il n'y a ni magasin d'attente ni reprise au retour du réseau. La lecture hors ligne, elle, est réelle. L'écran reste tel quel comme spécification de la file à construire.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 28px; padding: 0 48px 48px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px\">\n\n    <div id=\"11a\" style=\"display: flex; flex-direction: column; gap: 20px; width: 390px\">\n      <div style=\"display: flex; align-items: center; gap: 12px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; background: #386B6D; border-radius: 999px; padding: 6px 12px\">11a<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #386B6D\">Tournée — préparer, sombre<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width: 390px; height: 844px; border-radius: 44px; overflow: h
