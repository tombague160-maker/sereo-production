<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      background: #FBF7F5;
      color: #386B6D;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #C02B0A; } a:hover { color: #9c2208; }

    @keyframes seroFeuille {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .feuille { animation: seroFeuille .45s cubic-bezier(.22,1,.36,1) .15s both; }
    @keyframes seroVoile { from { opacity: 0; } to { opacity: 1; } }
    .voile { animation: seroVoile .35s ease-out both; }
    @media (prefers-reduced-motion: reduce) {
      .feuille, .voile { animation: none; }
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; background: #FBF7F5; overflow: hidden;">

  <!-- Ecran en arriere-plan, attenue -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">
    <div style="background: #386B6D; border-radius: 0 0 32px 32px; padding: 18px 20px 22px; color: #ffffff;">
      <div style="font-size: 13px; color: #A1C4C0;">Mercredi 2 septembre</div>
      <div style="font-size: 21px; font-weight: 600;">Tableau de bord</div>
    </div>
    <div style="padding: 20px 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="height: 96px; border-radius: 24px; background: #ffffff;"></div>
      <div style="height: 96px; border-radius: 24px; background: #ffffff;"></div>
      <div style="height: 96px; border-radius: 24px; background: #ffffff;"></div>
    </div>
  </div>

  <!-- Voile -->
  <div class="voile" style="position: absolute; inset: 0; background: rgba(56,107,109,.42);"></div>

  <!-- Feuille "Plus" -->
  <div class="feuille" style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 34px 34px 0 0; padding: 16px 18px 92px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 -10px 40px rgba(56,107,109,.2);">

    <div style="width: 44px; height: 4px; border-radius: 999px; background: #E0EAE8; align-self: center;"></div>

    <div style="font-size: 18px; font-weight: 600;">Tout le reste</div>

    <!-- Grille de destinations : deux colonnes, grandes cibles -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px;">

      <div style="height: 78px; border-radius: 22px; background: #FBF3F1; padding: 13px 15px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#EF9177" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>
        <span style="font-size: 13.5px; font-weight: 500;">Bons de commande</span>
      </div>

      <div style="height: 78px; border-radius: 22px; background: #EFF5F3; padding: 13px 15px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#386B6D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8 12 3 4 8v8l8 5 8-5Z"/><path d="M4 8l8 5 8-5M12 13v8"/></svg>
        <span style="font-size: 13.5px; font-weight: 500;">Stock</span>
      </div>

      <div style="height: 78px; border-radius: 22px; background: #EFF5F3; padding: 13px 15px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#386B6D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="3.5"/><path d="M21 20v-2a4 4 0 0 0-3-3.9"/></svg>
        <span style="font-size: 13.5px; font-weight: 500;">Clients</span>
      </div>

      <div style="height: 78px; border-radius: 22px; background: #FBF3F1; padding: 13px 15px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#EF9177" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span style="font-size: 13.5px; font-weight: 500;">Relances</span>
      </div>

      <div style="height: 78px; border-radius: 22px; background: #EFF5F3; padding: 13px 15px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#386B6D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span style="font-size: 13.5px; font-weight: 500;">Statistiques</span>
      </div>

      <div style="height: 78px; border-radius: 22px; background: #EFF5F3; padding: 13px 15px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#386B6D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>
        <span style="font-size: 13.5px; font-weight: 500;">Exports</span>
      </div>
    </div>

    <div style="height: 52px; border-radius: 999px; background: #F3EDEB; display: flex; align-items: center; gap: 12px; padding: 0 20px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C989A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-3-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9h-.2a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 3 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      <span style="font-size: 14.5px; font-weight: 500; color: #5C8285;">Réglages et comptes</span>
    </div>
  </div>

  <!-- Barre basse : quatre destinations, pas davantage -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #EDE4E1; padding: 9px 12px 14px; display: flex; justify-content: space-around; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B3C6C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      <span style="font-size: 10.5px; color: #B3C6C5; font-weight: 500;">Accueil</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B3C6C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>
      <span style="font-size: 10.5px; color: #B3C6C5; font-weight: 500;">Préparer</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B3C6C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17h4V5H2v12h3M20 17h2v-6l-3-4h-5v10h2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
      <span style="font-size: 10.5px; color: #B3C6C5; font-weight: 500;">Livrer</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EF9177" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="12" r="1.6"/></svg>
      <span style="font-size: 10.5px; color: #EF9177; font-weight: 600;">Plus</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
